<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Resume Builder - Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f1f5f9;
        font-family: Arial, sans-serif;
      }

      .login-container {
        width: 380px;
        padding: 35px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
      }

      h1 {
        text-align: center;
        color: #1e3a8a;
        margin-bottom: 10px;
      }

      h2 {
        text-align: center;
        color: #334155;
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin: 15px 0 6px;
        color: #334155;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        outline: none;
      }

      input:focus {
        border-color: #1e3a8a;
      }

      button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #1e3a8a;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #172554;
      }

      p {
        text-align: center;
        margin-top: 20px;
        color: #64748b;
      }

      a {
        color: #1e3a8a;
        text-decoration: none;
        font-weight: bold;
      }
      
    </style>
  </head>

  <body>
    <div class="login-container">
      <h1>Resume Builder</h1>

      <h2>Login</h2>

      <form id="loginForm">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        />

        <button type="submit">Login</button>
      </form>

      <p>
        Don't have an account?
        <a href="register.html">Register</a>
      </p>
    </div>

    <script src="login.js"></script>
  </body>
</html>
